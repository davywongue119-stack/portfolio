/* ---------- CERTIFICATIONS ---------- */
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.4rem}
.cert-card{border:1px solid var(--line);background:var(--bg2);overflow:hidden;transition:.35s;cursor:pointer;position:relative}
.cert-card:hover{border-color:rgba(200,240,74,.5);transform:translateY(-5px)}
.cert-thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:#16161b}
.cert-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.22,1,.36,1)}
.cert-card:hover .cert-thumb img{transform:scale(1.05)}
.cert-thumb img.preview-blur{filter:blur(4px) saturate(.7);opacity:.9}
.cert-unavail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;text-align:center;padding:1.4rem;background:rgba(11,11,13,.35)}
.cert-unavail .lock{width:2.6rem;height:2.6rem;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--mut)}
.cert-unavail p{font-size:.78rem;color:var(--ink);max-width:15rem;line-height:1.5}
.cert-unavail small{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
.cert-meta{padding:1.2rem 1.3rem 1.4rem;border-top:1px solid var(--line)}
.cert-meta h4{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.15rem;line-height:1.25;margin-bottom:.5rem}
.cert-meta .org{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.cert-meta .date{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--mut);margin-top:.55rem;display:block}
.cert-meta .verify{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:inline-block;margin-top:.7rem;border-bottom:1px solid rgba(200,240,74,.4);padding-bottom:.12rem}
.cert-meta .pending{display:inline-block;margin-top:.7rem;font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:.2rem .7rem}

/* ---------- LIGHTBOX ---------- */
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(6,6,8,.92);display:none;align-items:center;justify-content:center;padding:2rem;backdrop-filter:blur(6px)}
.lightbox.open{display:flex}
.lightbox figure{max-width:min(920px,94vw);max-height:88vh;display:flex;flex-direction:column}
